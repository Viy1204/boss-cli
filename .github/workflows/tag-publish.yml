name: tag-publish

on:
  push:
    tags:
      - 'v*'
  # `gh release create vX.Y.Z` 建的 tag 是服务端 Releases API 建的，不发 push 事件，
  # 所以只挂 push.tags 时手动建 Release 这条发版路径永远不会触发（实测：v0.6.8 / v0.7.0 零 run）。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish version without leading v (optional; defaults to package.json when manually dispatched)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name || github.event.inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide npm publish
        id: npm_gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is missing; skipping publish."
          fi

      - name: Setup Node
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Resolve target version
        id: version
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            target_version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            target_version="${{ github.event.inputs.version }}"
          else
            target_version="$current_version"
          fi

          if ! [[ "$target_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid publish version: $target_version" >&2
            exit 1
          fi

          # 预发布版（0.7.2-rc.1 之类）发到 `next`，不能顶掉 `latest`，
          # 否则所有 `npm i -g` 的人都会被换成未验证的版本。
          if [[ "$target_version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi

          echo "current=$current_version" >> "$GITHUB_OUTPUT"
          echo "target=$target_version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Sync package version
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: |
          current_version="$(node -p "require('./package.json').version")"
          target_version="${{ steps.version.outputs.target }}"
          if [ "$current_version" != "$target_version" ]; then
            npm version "$target_version" --no-git-tag-version
          else
            echo "package.json version already $target_version; skip npm version"
          fi

      - name: Install dependencies
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: npm ci

      - name: Build package
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: npm run build

      - name: Check published npm version
        id: npm_version
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        run: |
          version="${{ steps.version.outputs.target }}"
          pkg="$(node -p "require('./package.json').name")"
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          if npm view "${pkg}@${version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${pkg} ${version} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check publish payload
        if: ${{ steps.npm_gate.outputs.publish == 'true' && steps.npm_version.outputs.exists != 'true' }}
        run: npm pack --dry-run --json

      - name: Publish npm package
        id: npm_publish
        if: ${{ steps.npm_gate.outputs.publish == 'true' && steps.npm_version.outputs.exists != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

      - name: Update npm dist-tag
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.target }}"
          dist_tag="${{ steps.version.outputs.dist_tag }}"
          pkg="$(node -p "require('./package.json').name")"
          npm dist-tag add "${pkg}@${target}" "$dist_tag" --registry=https://registry.npmjs.org/

      # 判据是 `npm publish` / `npm dist-tag add` 的退出码，不是 registry 元数据什么时候可读。
      # registry 是最终一致的（首发或新包尤其慢），元数据没跟上不代表发布失败，
      # 所以这里只在「本次真的执行过 publish」时把超时降级成 warning。
      - name: Verify npm dist-tag
        if: ${{ steps.npm_gate.outputs.publish == 'true' }}
        env:
          PUBLISHED_THIS_RUN: ${{ steps.npm_publish.outcome }}
        run: |
          set -euo pipefail
          target="${{ steps.version.outputs.target }}"
          dist_tag="${{ steps.version.outputs.dist_tag }}"
          pkg="$(node -p "require('./package.json').name")"
          encoded="${pkg//\//%2f}"
          for attempt in $(seq 1 12); do
            # 绕开 CDN 缓存直读 packument，npm view 读到的可能是过期副本
            if doc="$(curl -fsSL -H 'Cache-Control: no-cache' "https://registry.npmjs.org/${encoded}")"; then
              tagged="$(printf '%s' "$doc" | jq -r --arg t "$dist_tag" '.["dist-tags"][$t] // ""')"
              known="$(printf '%s' "$doc" | jq -r --arg v "$target" '.versions | has($v)')"
              if [ "$tagged" = "$target" ] && [ "$known" = "true" ]; then
                echo "${pkg}@${target} is published and tagged ${dist_tag}."
                exit 0
              fi
              echo "npm registry reports ${dist_tag}=${tagged:-<none>}, ${target} known=${known}; waiting (attempt ${attempt}/12)..."
            else
              echo "npm registry metadata read failed (attempt ${attempt}/12); retrying..."
            fi
            sleep $(( attempt * 5 > 60 ? 60 : attempt * 5 ))
          done
          message="${pkg} npm ${dist_tag} did not converge to ${target} within ~6min"
          if [ "$PUBLISHED_THIS_RUN" = "success" ]; then
            echo "::warning::${message}; npm publish itself succeeded, treating as registry propagation lag."
            exit 0
          fi
          echo "${message}, and no publish ran in this job." >&2
          exit 1

  release:
    needs: publish
    # release 事件下 Release 已经存在（且可能带人写的说明），重跑 generate-notes 会把它覆盖掉，
    # 所以这个 job 只服务「先推 tag」那条路径。
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file <(gh api \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$TAG_NAME" \
                --jq .body)
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
